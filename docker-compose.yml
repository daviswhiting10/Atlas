# Local Postgres for fuzz runs and the Monday loop (docs/local-postgres.md). Never used by Vercel.
services:
  db:
    image: postgres:16.4
    container_name: atlas-local-db
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas_local
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - atlas-local-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_local"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  atlas-local-db:
